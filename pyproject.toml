[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamestick-inspector"
version = "0.3.4a3"
description = "Safety-first GameStick SD-card inspector with verified read-only raw imaging"
requires-python = ">=3.10"
dependencies = ["PyQt5==5.15.11"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
