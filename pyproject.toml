[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamestick-inspector"
version = "0.5.0a8.post2"
description = "Safety-first GameStick inspector with read-only Device Profile discovery and verified raw imaging"
requires-python = ">=3.10"
dependencies = ["PyQt5==5.15.11"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
